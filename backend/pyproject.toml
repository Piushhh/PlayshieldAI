[project]
name = "ipguardian-backend"
version = "0.1.0"
description = "IP Guardian - Content Protection Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<5.0.0",
    "python-multipart>=0.0.9",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "google-cloud-storage>=2.16.0",
    "google-cloud-aiplatform>=1.50.0",
    "pillow>=10.3.0",
    "imagehash>=4.3.1",
    "numpy>=1.26.0",
    "faiss-cpu>=1.8.0",
    "httpx>=0.27.0",
    "playwright>=1.44.0",
    "aiofiles>=23.2.0",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
    "jinja2>=3.1.0",
    "cloud-sql-python-connector[asyncpg]>=1.7.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
